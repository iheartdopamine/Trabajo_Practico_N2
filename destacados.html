<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Destacados</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navegación entre páginas -->
  <nav>
    <a href="index.html">Inicio</a>
    <a href="destacados.html">Destacados</a>
    <a href="listado.html">Listado</a>
  </nav>

  <main>

    <!-- Encabezado -->
    <header>
      <h1>Destacados</h1>
      <p>Hacé clic en una tarjeta para seleccionarla.</p>
    </header>

    <!-- Contador de tarjetas seleccionadas -->
    <p id="contador-seleccion">Seleccionadas: 0</p>

    <!-- Tarjetas generadas con JS -->
    <div id="cards-grid"></div>

    <!-- Botón para limpiar la selección -->
    <button id="btn-limpiar">Limpiar selección</button>

    <!-- Volver al inicio -->
    <a href="index.html">← Volver al inicio</a>

  </main>

  <script>
    // Arreglo de películas
    const peliculas = [
      { titulo: "Interestelar",          genero: "Ciencia ficcion" },
      { titulo: "El senor de los anillos", genero: "Fantasia"      },
      { titulo: "Matrix",                genero: "Accion"          },
      { titulo: "El rey leon",           genero: "Animacion"       },
      { titulo: "El origen",             genero: "Thriller"        },
      { titulo: "Forrest Gump",          genero: "Drama"           },
    ];

    let cantidadSeleccionadas = 0;

    // Actualiza el texto del contador en el DOM
    function actualizarContador() {
      document.getElementById("contador-seleccion").textContent =
        "Seleccionadas: " + cantidadSeleccionadas;
    }

    // Genera una tarjeta por cada pelicula y asigna el evento de clic
    function renderizarTarjetas() {
      const grid = document.getElementById("cards-grid");
      grid.className = "grid";

      peliculas.forEach(function(pelicula) {
        const div = document.createElement("div");
        div.className = "tarjeta";
        div.innerHTML = "<h3>" + pelicula.titulo + "</h3><p>" + pelicula.genero + "</p>";

        // Alterna la clase "seleccionada" y actualiza el contador
        div.addEventListener("click", function() {
          const estabaSeleccionada = div.classList.contains("seleccionada");
          div.classList.toggle("seleccionada");
          cantidadSeleccionadas = estabaSeleccionada
            ? cantidadSeleccionadas - 1
            : cantidadSeleccionadas + 1;
          actualizarContador();
        });

        grid.appendChild(div);
      });
    }

    // Quita la clase "seleccionada" de todas las tarjetas y resetea el contador
    function configurarLimpiar() {
      document.getElementById("btn-limpiar").addEventListener("click", function() {
        document.querySelectorAll(".tarjeta.seleccionada").forEach(function(t) {
          t.classList.remove("seleccionada");
        });
        cantidadSeleccionadas = 0;
        actualizarContador();
      });
    }

    renderizarTarjetas();
    configurarLimpiar();
  </script>

</body>
</html>
