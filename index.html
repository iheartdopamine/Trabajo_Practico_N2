<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menú de Meriendas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navegación entre páginas -->
  <nav>
    <a href="index.html">Inicio</a>
    <a href="destacados.html">Destacados</a>
    <a href="listado.html">Listado</a>
  </nav>

  <main>

    <!-- Encabezado -->
    <header>
      <h1>Menú de Meriendas</h1>
      <p>Explorá nuestras opciones de colaciones para el día.</p>
    </header>

    <!-- Tarjetas generadas con JS -->
    <section>
      <h2>Nuestras opciones</h2>
      <div id="snacks-grid"></div>
    </section>

    <!-- Botón que muestra el total de meriendas -->
    <section>
      <h2>¿Cuántas meriendas hay?</h2>
      <button id="btn-contar">Contar meriendas</button>
      <p id="resultado-contador"></p>
    </section>

  </main>

  <script>
    // Arreglo de meriendas
    const meriendas = [
      "Banana",
      "Yogur natural",
      "Manzana",
      "Nueces",
      "Tostada integral",
      "Kiwi",
    ];

    // Genera una tarjeta por cada merienda y la agrega al DOM
    function renderizarMeriendas() {
      const grid = document.getElementById("snacks-grid");
      grid.className = "grid";

      meriendas.map(function(merienda) {
        const div = document.createElement("div");
        div.className = "tarjeta";
        div.innerHTML = "<p>" + merienda + "</p>";
        return div;
      }).forEach(function(tarjeta) {
        grid.appendChild(tarjeta);
      });
    }

    // Muestra en el DOM cuántos elementos tiene el arreglo
    function configurarContador() {
      const boton = document.getElementById("btn-contar");
      const resultado = document.getElementById("resultado-contador");

      boton.addEventListener("click", function() {
        const cantidad = meriendas.length;

        if (cantidad === 1) {
          resultado.textContent = "Hay 1 merienda disponible.";
        } else {
          resultado.textContent = "Hay " + cantidad + " meriendas disponibles.";
        }
      });
    }

    renderizarMeriendas();
    configurarContador();
  </script>

</body>
</html>
