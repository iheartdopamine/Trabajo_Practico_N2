<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listado</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navegación entre páginas -->
  <nav>
    <a href="index.html">Inicio</a>
    <a href="destacados.html">Destacados</a>
    <a href="listado.html">Listado</a>
  </nav>

  <main>

    <!-- Encabezado -->
    <header>
      <h1>Listado de alimentos</h1>
      <p>Filtrá los elementos por categoría.</p>
    </header>

    <!-- Botones de filtro -->
    <div id="filtros">
      <button id="btn-todos">Todos</button>
      <button id="btn-frutas">Solo frutas</button>
      <button id="btn-vegetales">Solo vegetales</button>
    </div>

    <!-- Elementos generados con JS -->
    <div id="items-grid"></div>

    <!-- Volver al inicio -->
    <a href="index.html">← Volver al inicio</a>

  </main>

  <script>
    // Arreglo de alimentos con categoria
    const alimentos = [
      { nombre: "Frutilla",  categoria: "fruta"   },
      { nombre: "Naranja",   categoria: "fruta"   },
      { nombre: "Sandia",    categoria: "fruta"   },
      { nombre: "Durazno",   categoria: "fruta"   },
      { nombre: "Pimiento",  categoria: "vegetal" },
      { nombre: "Zanahoria", categoria: "vegetal" },
      { nombre: "Brocoli",   categoria: "vegetal" },
      { nombre: "Espinaca",  categoria: "vegetal" },
    ];

    // Limpia el grid y renderiza la lista recibida
    function renderizarAlimentos(lista) {
      const grid = document.getElementById("items-grid");
      grid.className = "grid";
      grid.innerHTML = "";

      lista.forEach(function(alimento) {
        const div = document.createElement("div");
        div.className = "tarjeta";
        div.innerHTML = "<p>" + alimento.nombre + "</p><small>" + alimento.categoria + "</small>";
        grid.appendChild(div);
      });
    }

    // Marca el boton activo y desactiva los demas
    function actualizarBotones(idActivo) {
      ["btn-todos", "btn-frutas", "btn-vegetales"].forEach(function(id) {
        document.getElementById(id).classList.remove("activo");
      });
      document.getElementById(idActivo).classList.add("activo");
    }

    // Eventos de los botones de filtro
    document.getElementById("btn-todos").addEventListener("click", function() {
      actualizarBotones("btn-todos");
      renderizarAlimentos(alimentos);
    });

    document.getElementById("btn-frutas").addEventListener("click", function() {
      actualizarBotones("btn-frutas");
      const frutas = alimentos.filter(function(a) { return a.categoria === "fruta"; });
      renderizarAlimentos(frutas);
    });

    document.getElementById("btn-vegetales").addEventListener("click", function() {
      actualizarBotones("btn-vegetales");
      const vegetales = alimentos.filter(function(a) { return a.categoria === "vegetal"; });
      renderizarAlimentos(vegetales);
    });

    // Carga inicial: muestra todos
    actualizarBotones("btn-todos");
    renderizarAlimentos(alimentos);
  </script>

</body>
</html>
